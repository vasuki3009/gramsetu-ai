services:
  - type: web
    name: gramsetu-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/whatsapp/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      # Read data.sql (Tamil text) as UTF-8 whatever the container's locale is.
      - key: JAVA_TOOL_OPTIONS
        value: -Dfile.encoding=UTF-8
      # Secrets and account-specific values: entered in the Render dashboard, never stored here.
      - key: GEMINI_API_KEY
        sync: false
      # Which AI answers first: gemini (default) or groq. The other is the fallback if its key is set.
      - key: AI_PROVIDER
        value: gemini
      - key: SARVAM_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: APP_PUBLIC_BASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
