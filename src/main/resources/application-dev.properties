# Local development profile — activate with SPRING_PROFILES_ACTIVE=dev
# Only non-secret conveniences live here; credentials still come from env vars.

# Local MySQL (override with SPRING_DATASOURCE_URL when using Docker on 3307)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/gramsetu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

# SQL logging for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow the Vite dev server
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.com.gramsetu=DEBUG

# Full component report on GET /api/whatsapp/health (the public default is just {"status":"UP"})
gramsetu.health.detailed=true
