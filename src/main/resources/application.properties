# ─────────────────────────────────────────────────────────────
# GramSetu backend configuration.
# Everything environment-specific is read from environment variables
# (see .env.example). No host, password or key has a default here.
# For local development activate the "dev" profile:
#   SPRING_PROFILES_ACTIVE=dev  (see application-dev.properties)
# ─────────────────────────────────────────────────────────────

# Application — PORT is injected by Railway/Heroku-style platforms
spring.application.name=gramsetu-backend
server.port=${PORT:8081}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA (SQL logging is off by default; the dev profile turns it on)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Encoding - force UTF-8 on all responses so Tamil text is not garbled
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force-response=true

# File upload ceiling (images and audio); the audio limit below is stricter
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:8MB}
spring.servlet.multipart.max-request-size=10MB

# Input limits
app.limits.max-question-length=${MAX_QUESTION_LENGTH:1000}
app.limits.max-audio-bytes=${MAX_AUDIO_BYTES:2097152}
app.limits.max-image-bytes=${MAX_IMAGE_BYTES:8388608}

# Per-IP rate limit on the AI-backed endpoints (see SecurityFilterConfig).
# ASSUMPTION: the app runs behind TRUSTED_PROXY_HOPS reverse proxies that append the client
# address to X-Forwarded-For (1 = one platform proxy, e.g. Railway). Set it to 0 when the
# app is exposed directly to the internet, otherwise the header can be forged to evade the limit.
ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
ratelimit.requests-per-minute=${RATE_LIMIT_PER_MINUTE:20}
ratelimit.trusted-proxy-hops=${RATE_LIMIT_TRUSTED_PROXY_HOPS:1}

# Data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Dialect used when none is detected: standard (default), kongu, madurai, nellai or chennai.
dialect.default=${DEFAULT_DIALECT:standard}

# AI provider for text answers: gemini (default) or groq. The other one is the fallback if its key is set.
ai.provider=${AI_PROVIDER:gemini}
# Gemini model (gemini-2.0-flash was retired on 1 June 2026). Used for answers and crop photos.
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
# Steady, repeatable answers; Tamil needs many tokens and Gemini 3 thinking counts against the limit.
# If the primary model keeps failing (503 "high demand", 429, timeouts) these are tried next, then Groq if its key is set.
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-3.6-flash,gemini-3.5-flash-lite}
# 429/5xx are retried: attempts per model, first backoff (doubles), and a time budget for retries (every model still gets one attempt).
ai.retry.max-attempts=${AI_RETRY_MAX_ATTEMPTS:2}
ai.retry.base-backoff-ms=${AI_RETRY_BASE_BACKOFF_MS:1000}
ai.retry.budget-ms=${AI_RETRY_BUDGET_MS:60000}
# Read timeout of one AI call (replies are sent in the background, so it can be long) and the Gemini thinking level.
ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:25000}
ai.thinking-level=${AI_THINKING_LEVEL:low}
ai.temperature=${AI_TEMPERATURE:0.2}
ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:2048}

# AI API Keys (GROQ is optional: it is the fallback, or the primary when AI_PROVIDER=groq)
gemini.api.key=${GEMINI_API_KEY}
sarvam.api.key=${SARVAM_API_KEY}
# Sarvam models (bulbul:v2 and saarika:v2 are retired/legacy). Speakers must match the TTS model: see SarvamTtsVoices.
sarvam.tts.model=${SARVAM_TTS_MODEL:bulbul:v3}
sarvam.stt.model=${SARVAM_STT_MODEL:saaras:v3}
groq.api.key=${GROQ_API_KEY:}

# Twilio - WhatsApp messaging
twilio.account.sid=${TWILIO_ACCOUNT_SID}
twilio.auth.token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM}
# Reject webhook calls without a valid X-Twilio-Signature. Set false ONLY for local curl testing.
twilio.validate-signature=${TWILIO_VALIDATE_SIGNATURE:true}

# Public HTTPS base URL of this backend (as Twilio sees it)
app.public.base.url=${APP_PUBLIC_BASE_URL}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# CORS — comma-separated exact origins; empty means no cross-origin access.
# Patterns are optional (e.g. Vercel preview deployments of this project only).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# Logging
logging.level.com.gramsetu=INFO
logging.level.org.springframework.web.client=INFO
