# Render free-tier profile: in-memory H2 (MySQL mode), no external database.
# Activate with SPRING_PROFILES_ACTIVE=render. Data lives only as long as the process:
# every restart or free-tier spin-down starts again from the seed data.

# These override the SPRING_DATASOURCE_* placeholders in application.properties,
# so none of those variables need to be set on Render.
spring.datasource.url=jdbc:h2:mem:gramsetu;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Build the schema fresh on every start; data.sql (INSERT IGNORE needs MODE=MySQL above)
# and DataInitializer then seed it.
spring.jpa.hibernate.ddl-auto=create

# data.sql holds Tamil text: read it as UTF-8 whatever the container's default charset is.
spring.sql.init.encoding=UTF-8
